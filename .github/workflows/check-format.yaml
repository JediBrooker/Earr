name: Checks

on:
  push:
    paths:
      - "**.py"
      - "**.html"
      - "**.css"
      - "**.jinja"
      - "**.yaml"
      - "justfile"
      - "uv.lock"
  pull_request:
    paths:
      - "**.py"
      - "**.html"
      - "**.css"
      - "**.jinja"
      - "**.yaml"
      - "justfile"
      - "uv.lock"
jobs:
  test:
    name: Format, types and migrations
    runs-on: ubuntu-latest

    env:
      ABR_APP__CONFIG_DIR: ./config

    steps:
      - uses: actions/checkout@v3
      - uses: jdx/mise-action@v4

      - run: uv sync --all-extras

      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Check Template Formats
        run: just test_format

      - name: Check Types
        run: just types

      - name: Check Templates Render
        run: just test_jinja

      - name: Check For Missing Migrations
        run: just check_migrations
