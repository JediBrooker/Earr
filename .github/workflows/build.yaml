name: Type check and Build

on:
  push:
    paths:
      - "**.py"
      - "**.html"
      - "**.css"
      - "**.jinja"
      - "**.yaml"
      - "uv.lock"
      - "justfile"
      - "package-lock.json"
      - "Dockerfile"
  pull_request:
    paths:
      - "**.py"
      - "**.html"
      - "**.css"
      - "**.jinja"
      - "**.yaml"
      - "uv.lock"
      - "justfile"
      - "package-lock.json"
      - "Dockerfile"
  release:
    types: [created]

jobs:
  test:
    name: Test types
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      - uses: jdx/mise-action@v4

      - run: uv sync --all-extras

      - name: Run Type and format checks
        run: just types

      - name: Check if Jinjax parameters are defined
        run: just test_jinja

      - name: Run tests
        run: just test

      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH

      - name: Check SQLite Alembic Migrations
        run: |
          uv run alembic upgrade heads
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade heads
          uv run alembic check

      - name: Check PSQL Alembic Migrations
        run: |
          uv run alembic upgrade heads
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade heads
          uv run alembic check
        env:
          EARR_DB__POSTGRES_HOST: localhost
          EARR_DB__POSTGRES_PORT: 5432
          EARR_DB__POSTGRES_USER: postgres
          EARR_DB__POSTGRES_PASSWORD: postgres
          EARR_DB__POSTGRES_DB: postgres
          EARR_DB__USE_POSTGRES: true

  build:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN is provided automatically, so this works on a fork with
      # no secrets to configure
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: vars
        run: |
          # ghcr requires a lowercase path
          IMAGE="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/earr"
          if [ "${{ github.event_name }}" == "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
            VERSION="${VERSION#v}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            echo "tags=$IMAGE:$VERSION,$IMAGE:$MAJOR.$MINOR,$IMAGE:$MAJOR,$IMAGE:latest" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
          else
            SHA=${{ github.sha }}
            SHORT=${SHA:0:7}
            # tag every build with its commit so it is obvious what is deployed
            echo "tags=$IMAGE:latest,$IMAGE:sha-$SHORT" >> $GITHUB_OUTPUT
            echo "version=main-$SHORT" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          # amd64 only: the deployment target is x86 and emulating arm64 under
          # QEMU makes this job an order of magnitude slower
          platforms: linux/amd64
          push: true
          tags: ${{ steps.vars.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.vars.outputs.version }}
